<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APP TESTE - Gestão Inteligente</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0000FF',
              light: '#3333FF',
              dark: '#0000CC'
            },
            zinc: {
              850: '#1f1f23',
              750: '#2b2b30'
            }
          }
        }
      }
    }
  </script>

  <!-- External CDNs for Charts, PDF, Excel and Icons -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Application Custom Styles -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-[#F8F9FA] dark:bg-[#18181B] text-zinc-900 dark:text-zinc-100 min-h-screen">
  <!-- Application Shell Mount -->
  <div id="app-root"></div>

  <!-- Global Modal & Toast Roots -->
  <div id="modal-root"></div>
  <div id="toast-container"></div>

  <!-- Main ES6 Application Script -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
